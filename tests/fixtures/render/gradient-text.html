<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Text on a gradient</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px; color: #111; background: #fff; }
  .hero { padding: 32px; background: linear-gradient(90deg, #f8fafc, #94a3b8); color: #475569; }
</style></head>
<body>
  <main><div class="hero"><p>Text whose contrast depends on where it sits on the gradient.</p></div></main>
</body></html>
