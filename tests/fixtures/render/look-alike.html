<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Look-alike rows</title>
<style>
  body { font: 16px system-ui, sans-serif; padding: 24px; color: #111; background: #fff; }
  .row { display: flex; justify-content: space-between; align-items: center; max-width: 480px; padding: 8px 0; border-bottom: 1px solid #ddd; }
  .row-btn { font: inherit; padding: 8px 14px; border: 1px solid #555; border-radius: 6px; background: #fff; color: #111; }
  .row-btn:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  #last { font: inherit; margin-top: 16px; padding: 8px 14px; border: 1px solid #555; background: #fff; color: #111; outline: none; }
</style></head>
<body>
  <!-- Four buttons with one class string and one label, as a list renders them: the walk must not stop at the second. -->
  <div class="row"><span>Rent</span><button class="row-btn" type="button">Edit</button></div>
  <div class="row"><span>Groceries</span><button class="row-btn" type="button">Edit</button></div>
  <div class="row"><span>Phone</span><button class="row-btn" type="button">Edit</button></div>
  <div class="row"><span>Gym</span><button class="row-btn" type="button">Edit</button></div>
  <button id="last" type="button">Last button</button>
</body></html>
