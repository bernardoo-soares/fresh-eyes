<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calls to action</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; color: #111; background: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  section { padding: 32px 24px; }
  .cta { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #0f766e; color: #fff; text-decoration: none; }
  .plans { display: flex; gap: 16px; }
  .plan { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
  .plan .cta { background: #1d4ed8; }
  .spacer { height: 2400px; }
</style></head>
<body>
  <!-- In the header and again in the hero, on one screen: the template's repeated call to action. -->
  <header><strong>Meeting notes</strong><a class="cta" href="#trial">Start free trial</a></header>
  <section><h1>Turn meeting recordings into notes your team can search</h1><a class="cta" href="#trial">Start free trial</a></section>
  <!-- One per plan card, side by side on one row: peers, not a repeat. -->
  <section class="plans">
    <div class="plan"><h2>Solo</h2><p>EUR 8 a month</p><a class="cta" href="#solo">Choose plan</a></div>
    <div class="plan"><h2>Team</h2><p>EUR 12 a seat</p><a class="cta" href="#team">Choose plan</a></div>
    <div class="plan"><h2>Business</h2><p>EUR 20 a seat</p><a class="cta" href="#biz">Choose plan</a></div>
  </section>
  <!-- Offered on the first screen and again after the price, far below: what references/landing.md asks for. -->
  <section><a class="cta" href="#wait" style="background:#7c3aed">Join the waitlist</a></section>
  <div class="spacer"></div>
  <section><p>Prices include VAT.</p><a class="cta" href="#wait" style="background:#7c3aed">Join the waitlist</a></section>
</body></html>
