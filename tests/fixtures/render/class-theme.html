<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Class-themed app</title>
<style>
  /* Dark mode switched by a class on <html> only, the way next-themes and Tailwind's class strategy do it. */
  :root { --bg: #ffffff; --fg: #111111; }
  .dark { --bg: #121212; --fg: #f5f5f7; }
  body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
</style></head>
<body><main><h1>Settings</h1><p>No prefers-color-scheme rule anywhere on this page.</p></main></body></html>
