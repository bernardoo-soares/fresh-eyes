<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Small targets</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px; color: #111; background: #fff; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .sr-only:focus { position: static; width: auto; height: auto; margin: 0; clip: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  /* The shadcn/ui checkbox: a 16 px box whose hit area a pseudo-element grows; spaced rows pass WCAG 2.5.8. */
  .check { position: relative; width: 16px; height: 16px; padding: 0; border: 1px solid #555; border-radius: 4px; background: #fff; }
  .check::after { content: ""; position: absolute; inset: -4px; }
  .swatches { display: flex; gap: 2px; padding: 12px 0; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; }
</style></head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <main id="main">
    <div class="row"><button class="check" role="checkbox" aria-checked="false" aria-label="Email me"></button><span>Email me</span></div>
    <div class="row"><button class="check" role="checkbox" aria-checked="true" aria-label="Text me"></button><span>Text me</span></div>
    <div class="row"><input aria-label="Search"></div>
    <!-- Focusable, with no widget role, so axe's target-size skips them; 16 px and 2 px apart, so they fail. -->
    <div class="swatches"><span tabindex="0" class="swatch" role="img" style="background:#dc2626" aria-label="Red"></span><span tabindex="0" class="swatch" role="img" style="background:#2563eb" aria-label="Blue"></span></div>
  </main>
</body></html>
