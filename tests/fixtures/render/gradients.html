<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient buttons</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px; color: #111; background: #fff; }
  .grad { font: inherit; padding: 10px 16px; margin-right: 8px; border: 0; border-radius: 999px; color: #fff; background-image: linear-gradient(90deg, #7c3aed, oklch(0.55 0.25 300)); }
</style></head>
<body><p><button class="grad" type="button">Generate report</button><button class="grad" type="button">Upgrade now</button></p></body></html>
