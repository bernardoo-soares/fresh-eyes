<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Findings in one variant only</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px; color: #111; background: #fff; }
  .alert { padding: 12px 16px; background: #fef2f2; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #555; border-radius: 6px; background: #fff; color: #111; }
  button:focus-visible { outline: 2px solid #111111; outline-offset: 2px; }
  .pay { display: none; width: 240px; height: 48px; }
  @media (max-width: 600px) {
    .alert { border-left: 4px solid #dc2626; }
    .pay { display: block; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111111; color: #eeeeee; }
    .alert { background: #2a1215; }
    button { background: #111111; color: #eeeeee; border-color: #444444; }
    /* The ring's colour token was only defined for light: in dark the ring is gone. */
    button:focus-visible { outline-color: transparent; }
  }
</style></head>
<body>
  <p class="alert">The card on file expires this month.</p>
  <button type="button">Retry</button>
  <button class="pay" type="button" disabled>Pay EUR 42.00</button>
</body></html>
