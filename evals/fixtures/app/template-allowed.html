<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Allowed look-alikes</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px 24px 96px; color: #111; background: #fff; }
  .label { font-size: 13px; color: #555; }
  h1 { font-size: 40px; margin: 4px 0 16px; }
  .card { border: 1px solid #ddd; border-radius: 16px; padding: 8px 16px; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; font-size: 13px; }
  .primary { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #0f766e; color: #fff; text-decoration: none; }
  nav.tabbar { position: fixed; left: 16px; right: 16px; bottom: 16px; height: 60px; border-radius: 30px; background: #111; color: #fff; display: flex; justify-content: space-around; align-items: center; }
  nav.tabbar a { color: #fff; text-decoration: none; }
  p { max-width: 60ch; }
</style></head>
<body>
  <p class="label">Account value</p>
  <h1>€18,751.75</h1>
  <p>A left-aligned explanation that runs for more than one line, the way a product explains a figure in its own place without centring the text under it.</p>
  <span class="pill">Paid</span>
  <p>Order <code style="font-family: ui-monospace, Menlo, monospace">SO-48389</code></p>
  <h3>Address not valid <span style="background:#fee2e2;color:#b91c1c;border-radius:999px;padding:0 8px">11</span></h3>
  <div class="card">
    <div class="row"><span>Rent</span><span>−€900.00</span></div>
    <div class="row"><span>Groceries</span><span>−€64.20</span></div>
  </div>
  <p><a class="primary" href="#add">Add money</a></p>
  <nav class="tabbar" aria-label="Main"><a href="#h">Home</a><a href="#i">Invest</a><a href="#p">Payments</a></nav>
</body></html>
