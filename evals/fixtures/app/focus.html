<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus cases</title>
<style>
  body { font: 16px system-ui, sans-serif; padding: 24px; }
  button { font: inherit; padding: 10px 16px; margin: 12px; border: 1px solid #555; background: #fff; color: #000; }
  #static-shadow { box-shadow: 0 0 0 3px #1d4ed8; outline: none; }
  #bg-change { outline: none; } #bg-change:focus { background: #1d4ed8; color: #fff; }
  .wrap { display: inline-block; padding: 4px; border-radius: 8px; margin: 12px; } .wrap:focus-within { box-shadow: 0 0 0 3px #1d4ed8; }
  .wrap input { outline: none; border: 1px solid #555; padding: 8px; font: inherit; }
</style></head>
<body>
  <button id="static-shadow">Static shadow</button>
  <button id="bg-change">Background change</button>
  <span class="wrap"><input id="within" aria-label="Wrapped input"></span>
  <a id="link" href="#x">Default link</a>
</body></html>
